services:
  - type: web
    name: ferrostock
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ferrostock-db
          property: connectionString

databases:
  - name: ferrostock-db
    databaseName: ferrostock
    user: ferrostock
    plan: free
    region: oregon
    postgresMajorVersion: "16"
